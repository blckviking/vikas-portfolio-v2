<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0e0c;
    --paper: #f5f2eb;
    --paper-warm: #ede9de;
    --accent: #c94a2b;
    --accent-muted: #e8c4b8;
    --gold: #b8962e;
    --text-muted: #6b6560;
    --border: rgba(15,14,12,0.12);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Instrument Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    cursor: none;
  }

  .cursor-dot {
    width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%); transition: transform 0.1s ease;
  }
  .cursor-ring {
    width: 36px; height: 36px; border: 1.5px solid var(--accent); border-radius: 50%;
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%); transition: all 0.15s ease; opacity: 0.6;
  }
  .cursor-ring.hovered { transform: translate(-50%, -50%) scale(1.8); opacity: 0.3; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--paper); border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: var(--serif); font-size: 1.25rem; font-weight: 700;
    color: var(--ink); text-decoration: none; letter-spacing: -0.02em;
  }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    font-size: 0.8125rem; font-family: var(--mono); color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }

  .article { max-width: 720px; margin: 0 auto; padding: 8.5rem 1.5rem 4rem; }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); text-decoration: none;
    margin-bottom: 2.5rem; transition: color 0.2s;
  }
  .back-link:hover { color: var(--accent); }

  .article-meta {
    display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 1.25rem;
  }
  .article-meta .tag { color: var(--accent); }

  .article-title {
    font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700; line-height: 1.08; letter-spacing: -0.03em;
    margin-bottom: 1.25rem;
  }
  .article-desc {
    font-family: var(--serif); font-style: italic; font-size: 1.25rem;
    font-weight: 300; color: var(--text-muted); line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .article-cover {
    width: 100%; margin: 0 0 3rem; border: 1px solid var(--border);
  }
  .article-cover img { width: 100%; display: block; }
  .article-cover-fallback {
    height: 320px;
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(201,74,43,0.22), transparent 55%),
      radial-gradient(120% 120% at 100% 100%, rgba(184,150,46,0.20), transparent 55%),
      var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .article-cover-fallback span {
    font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: 5rem; color: var(--paper); opacity: 0.9;
  }

  .article-body > * + * { margin-top: 1.5rem; }
  .article-body h2 {
    font-family: var(--serif); font-size: 1.7rem; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.2; margin-top: 3rem;
  }
  .article-body p { font-size: 1.0625rem; color: #2a2823; }
  .article-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .article-body ul { padding-left: 1.25rem; }
  .article-body li { font-size: 1.0625rem; color: #2a2823; margin-top: 0.6rem; }
  .article-body figure { margin: 2.5rem 0; }
  .article-body figure img {
    width: 100%; display: block; border: 1px solid var(--border);
  }
  .article-body .img-fallback {
    height: 260px; border: 1px solid var(--border);
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(201,74,43,0.14), transparent 55%),
      var(--paper-warm);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); text-align: center; padding: 1rem;
  }
  .article-body figcaption {
    font-family: var(--mono); font-size: 0.72rem; color: var(--text-muted);
    text-align: center; margin-top: 0.75rem; letter-spacing: 0.03em;
  }
  .article-body blockquote {
    border-left: 3px solid var(--accent); padding: 0.5rem 0 0.5rem 1.5rem;
    font-family: var(--serif); font-style: italic; font-size: 1.4rem;
    font-weight: 300; line-height: 1.4; color: var(--ink);
  }
  .article-body blockquote cite {
    display: block; margin-top: 0.75rem; font-family: var(--mono); font-style: normal;
    font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
  }

  .article-footer {
    margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .article-footer a {
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink); text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  .article-footer a:hover { color: var(--accent); }

  .not-found { text-align: center; padding: 4rem 0; }
  .not-found h1 { font-family: var(--serif); font-size: 2.5rem; margin-bottom: 1rem; }
  .not-found p { color: var(--text-muted); margin-bottom: 2rem; }

  footer {
    background: var(--ink); border-top: 1px solid rgba(245,242,235,0.1);
    padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: center;
  }
  .footer-copy {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em;
    color: rgba(245,242,235,0.3); text-transform: uppercase;
  }
  .footer-links { display: flex; gap: 2rem; }
  .footer-links a {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(245,242,235,0.4);
    text-decoration: none; transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--accent); }

  @media (max-width: 768px) {
    body { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
    nav { padding: 1rem 1.5rem; }
    .nav-links { gap: 1.25rem; }
    .article { padding: 7rem 1.5rem 3rem; }
    footer { flex-direction: column; gap: 1rem; text-align: center; }
  }
</style>

<script src="blog-posts.js"></script>
<script>
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px'; dot.style.top = my + 'px';
  });
  (function animateRing() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animateRing);
  })();

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || '';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // Renders a single content block. Paragraph/list text may contain trusted
  // inline HTML (bold/italic/links), so those are NOT escaped.
  function renderBlock(block) {
    if (!block || !block.type) return '';
    switch (block.type) {
      case 'heading':
        return `<h2>${escapeHtml(block.text)}</h2>`;
      case 'paragraph':
        return `<p>${block.text || ''}</p>`;
      case 'list': {
        const items = (block.items || []).map(i => `<li>${i}</li>`).join('');
        return `<ul>${items}</ul>`;
      }
      case 'quote':
        return `<blockquote>${escapeHtml(block.text)}${
          block.cite ? `<cite>${escapeHtml(block.cite)}</cite>` : ''
        }</blockquote>`;
      case 'image': {
        const inner = block.src
          ? `<img src="${escapeHtml(block.src)}" alt="${escapeHtml(block.alt || '')}">`
          : `<div class="img-fallback">Image placeholder${
              block.alt ? ' — ' + escapeHtml(block.alt) : ''
            }</div>`;
        return `<figure>${inner}${
          block.caption ? `<figcaption>${escapeHtml(block.caption)}</figcaption>` : ''
        }</figure>`;
      }
      default:
        return '';
    }
  }

  function renderPost() {
    const el = document.getElementById('article');
    const slug = getParam('slug');
    const posts = (typeof BLOG_POSTS !== 'undefined' && Array.isArray(BLOG_POSTS)) ? BLOG_POSTS : [];
    const post = posts.find(p => p.slug === slug);

    if (!post) {
      el.innerHTML = `
        <div class="not-found">
          <h1>Post not found</h1>
          <p>This article doesn't exist or may have moved.</p>
          <a class="back-link" href="blog.html">← Back to all posts</a>
        </div>`;
      return;
    }

    document.title = `${post.title} — Vikas Vasudevan`;
    document.getElementById('metaDescription').setAttribute('content', post.description || '');
    document.getElementById('ogTitle').setAttribute('content', post.title || '');
    document.getElementById('ogDescription').setAttribute('content', post.description || '');

    const meta = [
      post.tag ? `<span class="tag">${escapeHtml(post.tag)}</span>` : '',
      post.date ? `<span>${escapeHtml(formatDate(post.date))}</span>` : '',
      post.readTime ? `<span>${escapeHtml(post.readTime)}</span>` : '',
    ].filter(Boolean).join('');

    const cover = post.cover
      ? `<div class="article-cover"><img src="${escapeHtml(post.cover)}" alt="${escapeHtml(post.title)}"></div>`
      : `<div class="article-cover"><div class="article-cover-fallback"><span>${
          escapeHtml((post.title || 'V').trim().charAt(0))
        }</span></div></div>`;

    const body = (post.content || []).map(renderBlock).join('');

    el.innerHTML = `
      <a class="back-link" href="blog.html">← All posts</a>
      <div class="article-meta">${meta}</div>
      <h1 class="article-title">${escapeHtml(post.title)}</h1>
      <p class="article-desc">${escapeHtml(post.description)}</p>
      ${cover}
      <div class="article-body">${body}</div>
      <div class="article-footer">
        <a href="blog.html">← All posts</a>
        <a href="index.html#contact">Get in touch <span>↗</span></a>
      </div>`;

    document.querySelectorAll('a, button').forEach(elx => {
      elx.addEventListener('mouseenter', () => ring.classList.add('hovered'));
      elx.addEventListener('mouseleave', () => ring.classList.remove('hovered'));
    });
  }

  renderPost();
</script>
</body>
